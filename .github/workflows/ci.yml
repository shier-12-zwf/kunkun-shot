name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure system FFmpeg is available
        run: command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Run tests
        run: npm run test:all

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Package macOS app without distribution credentials
        run: npm run dist:mac:ci

      - name: Upload source-bound native helpers
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-helpers-${{ github.sha }}
          path: dist/ci-package/mac*/困困截图工具.app/Contents/Resources/native-helpers/
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test the packaged macOS app
        run: npm run test:packaged
