<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>困困截图 · 标注</title>
  <link rel="stylesheet" href="./overlay.css" />
</head>
<body>
  <!-- 背景层：整屏截图（物理像素，CSS 缩到显示器尺寸） + 半透明黑蒙层 -->
  <!-- 背景图用 canvas 绘制，便于后续合成时直接取像素 -->
  <canvas id="bgCanvas" class="bg-canvas"></canvas>
  <!-- 蒙层：用四块 div 拼出"选区外变暗"的效果（选区内保持原亮度） -->
  <div id="maskTop" class="mask"></div>
  <div id="maskLeft" class="mask"></div>
  <div id="maskRight" class="mask"></div>
  <div id="maskBottom" class="mask"></div>

  <!-- 提示语（未开始框选时显示） -->
  <div id="hint" class="hint">拖动鼠标框选区域 · Esc / 右键取消 · C 取色 · 方向键 1px 微调</div>

  <!-- 选区容器：边框 + 控制点 + 标注画布 -->
  <div id="selection" class="selection" hidden>
    <!-- 标注画布（覆盖选区，画在 CSS 像素坐标系，提交时按 scaleFactor 放大合成） -->
    <canvas id="annoCanvas" class="anno-canvas"></canvas>
    <!-- 八个控制点：四角 + 四边中点 -->
    <div class="handle" data-pos="nw"></div>
    <div class="handle" data-pos="n"></div>
    <div class="handle" data-pos="ne"></div>
    <div class="handle" data-pos="e"></div>
    <div class="handle" data-pos="se"></div>
    <div class="handle" data-pos="s"></div>
    <div class="handle" data-pos="sw"></div>
    <div class="handle" data-pos="w"></div>
  </div>

  <!-- 尺寸标签（跟随选区左上角） -->
  <div id="sizeLabel" class="size-label" hidden></div>

  <!-- 放大镜（框选/调整时跟随鼠标，含取色读数） -->
  <div id="magnifier" class="magnifier" hidden>
    <canvas id="magCanvas" width="120" height="90"></canvas>
    <div class="mag-cross-h"></div>
    <div class="mag-cross-v"></div>
    <div id="magColor" class="mag-color"></div>
    <div id="magInfo" class="mag-info"></div>
  </div>

  <!-- 轻提示（复制颜色等反馈） -->
  <div id="kkTip" class="kk-tip" role="status"></div>

  <!-- 工具栏（松开鼠标后出现在选区下方/上方） -->
  <div id="toolbar" class="toolbar" hidden>
    <!-- 标注工具组 -->
    <div class="tool-group" id="toolGroup">
      <button class="tool-btn" data-tool="select" title="选择/移动/再编辑标注 (V)">
        <svg viewBox="0 0 24 24"><path d="M5 4 L5 18 L9 14 L12 20 L14.5 19 L11.5 13 L17 13 Z"/></svg>
      </button>
      <button class="tool-btn" data-tool="rect" title="矩形">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button class="tool-btn" data-tool="arrow" title="箭头">
        <svg viewBox="0 0 24 24"><path d="M5 19 L19 5 M19 5 L11 5 M19 5 L19 13"/></svg>
      </button>
      <button class="tool-btn" data-tool="pen" title="画笔">
        <svg viewBox="0 0 24 24"><path d="M4 20 C8 12 10 10 14 8 C16 7 18 6 20 4"/></svg>
      </button>
      <button class="tool-btn" data-tool="text" title="文字">
        <svg viewBox="0 0 24 24"><path d="M5 6 H19 M12 6 V19 M9 19 H15"/></svg>
      </button>
      <button class="tool-btn" data-tool="mosaic" title="马赛克">
        <svg viewBox="0 0 24 24"><path d="M4 4h5v5H4z M14 4h5v5h-5z M9 9h5v5H9z M4 14h5v5H4z M14 14h5v5h-5z"/></svg>
      </button>
      <button
        class="tool-btn toolbar-menu-trigger"
        id="btnToolMore"
        type="button"
        title="更多标注工具"
        aria-label="更多标注工具"
        aria-expanded="false"
        aria-controls="annotationMenu"
      >
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
      <div class="toolbar-menu annotation-menu" id="annotationMenu" role="group" aria-label="更多标注工具" hidden>
        <button class="tool-btn toolbar-menu-item" data-tool="ellipse" type="button" title="椭圆">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><span>椭圆</span>
        </button>
        <button class="tool-btn toolbar-menu-item" data-tool="line" type="button" title="直线">
          <svg viewBox="0 0 24 24"><path d="M5 19 L19 5"/></svg><span>直线</span>
        </button>
        <button class="tool-btn toolbar-menu-item" data-tool="highlight" type="button" title="荧光笔（半透明高亮）">
          <svg viewBox="0 0 24 24"><path d="M4 20 C8 12 10 10 14 8 C16 7 18 6 20 4" stroke-width="3" opacity="0.7"/><path d="M4 18 L10 12"/></svg><span>荧光笔</span>
        </button>
        <button class="tool-btn toolbar-menu-item" data-tool="polyline" type="button" title="折线（单击加点 · 双击/Enter 完成 · Esc 取消）">
          <svg viewBox="0 0 24 24"><path d="M4 19 L9 6 L14 13 L20 4"/></svg><span>折线</span>
        </button>
        <button class="tool-btn toolbar-menu-item" data-tool="number" type="button" title="序号笔">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><text x="12" y="16" class="num-glyph">1</text></svg><span>序号笔</span>
        </button>
        <button class="tool-btn toolbar-menu-item" data-tool="blur" type="button" title="模糊画笔（真实高斯模糊）">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M9 9h.01 M15 9h.01 M9 15h.01 M15 15h.01 M12 12h.01"/></svg><span>模糊</span>
        </button>
        <button class="tool-btn toolbar-menu-item" data-tool="spotlight" type="button" title="聚光灯（拖出椭圆高亮区域）">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="7" ry="5"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3"/></svg><span>聚光灯</span>
        </button>
        <button class="tool-btn toolbar-menu-item" data-tool="magnifier" type="button" title="放大镜（拖出镜片，可移动、缩放和调节倍率）">
          <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L20 20 M7 10h6 M10 7v6"/></svg><span>放大镜</span>
        </button>
        <button class="tool-btn toolbar-menu-item" data-tool="watermark" type="button" title="文字水印（35% 透明、倾斜）">
          <svg viewBox="0 0 24 24"><path d="M4 7h16 M8 7v10 M16 7v10 M6 17h4 M14 17h4" opacity=".75"/><path d="M3 20L21 4"/></svg><span>水印</span>
        </button>
      </div>
    </div>

    <span class="divider"></span>

    <!-- 颜色 + 粗细 -->
    <div class="tool-group" id="colorGroup">
      <button class="color-btn" data-color="#ef4444" style="--c:#ef4444" title="红"></button>
      <button class="color-btn" data-color="#f59e0b" style="--c:#f59e0b" title="橙"></button>
      <button class="color-btn" data-color="#16a34a" style="--c:#16a34a" title="绿"></button>
      <button class="color-btn" data-color="#2563eb" style="--c:#2563eb" title="蓝"></button>
      <button class="color-btn" data-color="#111111" style="--c:#111111" title="黑"></button>
      <button class="color-btn" data-color="#ffffff" style="--c:#ffffff" title="白"></button>
    </div>

    <div class="tool-group" id="widthGroup" title="粗细">
      <button class="width-btn" data-width="2" title="细"><span style="height:2px"></span></button>
      <button class="width-btn" data-width="4" title="中"><span style="height:4px"></span></button>
      <button class="width-btn" data-width="7" title="粗"><span style="height:7px"></span></button>
    </div>

    <label class="magnifier-zoom-control" id="magnifierZoomGroup" title="放大镜倍率" hidden>
      <span>倍率</span>
      <select id="magnifierZoom" aria-label="放大镜倍率">
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2" selected>2×</option>
        <option value="3">3×</option>
        <option value="4">4×</option>
        <option value="6">6×</option>
        <option value="8">8×</option>
      </select>
    </label>

    <span class="divider"></span>

    <!-- 撤销 / 重做 -->
    <div class="tool-group">
      <button class="tool-btn" id="btnUndo" title="撤销 (Ctrl/Cmd+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 7 L4 12 L9 17 M4 12 H15 a5 5 0 0 1 5 5"/></svg>
      </button>
      <button class="tool-btn" id="btnRedo" title="重做 (Ctrl/Cmd+Shift+Z)">
        <svg viewBox="0 0 24 24"><path d="M15 7 L20 12 L15 17 M20 12 H9 a5 5 0 0 0 -5 5"/></svg>
      </button>
      <button class="tool-btn" id="btnDelete" title="删除选中标注 (Delete)" disabled>
        <svg viewBox="0 0 24 24"><path d="M5 7h14 M9 7V4h6v3 M7 7l1 13h8l1-13 M10 11v6 M14 11v6"/></svg>
      </button>
    </div>

    <span class="divider"></span>

    <!-- 动作按钮 -->
    <div class="tool-group" id="actionGroup">
      <button class="action-btn" data-action="translate" type="button" title="翻译图中文字（译文原位盖回）" aria-label="原位翻译">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18"/></svg>
        <span>翻译</span>
      </button>
      <label class="translate-target" title="翻译目标语言">
        <span>译为</span>
        <select id="trLang" class="tr-lang" aria-label="翻译目标语言">
          <option value="中文">中文</option>
          <option value="英语">英语</option>
          <option value="日语">日语</option>
          <option value="韩语">韩语</option>
          <option value="法语">法语</option>
          <option value="德语">德语</option>
          <option value="西班牙语">西语</option>
          <option value="俄语">俄语</option>
        </select>
      </label>
      <button class="action-btn icon-only" data-action="ocr" title="OCR 识别文字" aria-label="OCR 识别文字">
        <svg viewBox="0 0 24 24"><path d="M4 8V5h3 M20 8V5h-3 M4 16v3h3 M20 16v3h-3 M8 12h8"/></svg>
        <span>OCR</span>
      </button>
      <button
        class="action-btn icon-only toolbar-menu-trigger"
        id="btnActionMore"
        type="button"
        title="更多截图、识别、处理与保存功能"
        aria-label="更多截图、识别、处理与保存功能"
        aria-expanded="false"
        aria-controls="actionMenu"
      >
        <svg viewBox="0 0 24 24"><path d="M12 3l1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3z M18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z M5.5 13l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9.9-2.6z"/></svg>
        <span>更多</span>
      </button>
      <div class="toolbar-menu action-menu" id="actionMenu" role="group" aria-label="更多截图与处理选项" hidden>
        <span class="toolbar-menu-heading">截图选项</span>
        <fieldset class="selection-geometry" aria-label="选区尺寸与比例">
          <label><span>宽</span><input id="selectionWidth" type="number" min="1" step="1" inputmode="numeric" aria-label="选区宽度（源像素）" /></label>
          <label><span>高</span><input id="selectionHeight" type="number" min="1" step="1" inputmode="numeric" aria-label="选区高度（源像素）" /></label>
          <label><span>尺寸</span><select id="selectionSizePreset" aria-label="选区尺寸预设">
            <option value="custom">自定义</option>
            <option value="640x480">640 × 480</option>
            <option value="1280x720">1280 × 720</option>
            <option value="1920x1080">1920 × 1080</option>
            <option value="1080x1080">1080 × 1080</option>
          </select></label>
          <label><span>比例</span><select id="selectionRatio" aria-label="选区宽高比">
            <option value="free">自由</option>
            <option value="1:1">1 : 1</option>
            <option value="4:3">4 : 3</option>
            <option value="16:9">16 : 9</option>
          </select></label>
        </fieldset>
        <button class="tool-btn toolbar-menu-item selection-option-btn" id="btnRatioLock" type="button" aria-pressed="false" title="锁定宽高比（按当前比例调整选框）">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>比例锁定</span>
        </button>
        <button class="tool-btn toolbar-menu-item selection-option-btn" id="btnRounded" type="button" aria-pressed="false" title="圆角截图">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/></svg><span>圆角截图</span>
        </button>
        <button class="tool-btn toolbar-menu-item selection-option-btn" id="btnAx" type="button" aria-pressed="false" title="智能识别 UI 元素（悬停高亮，点击框选）">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 3v18 M16 3v18 M3 8h18 M3 16h18" opacity="0.5"/></svg><span>智能框选</span>
        </button>
        <button class="tool-btn toolbar-menu-item selection-option-btn" id="btnFrame" type="button" aria-pressed="false" title="边框/阴影（点击切换：无 → 边框 → 阴影）">
          <svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12" rx="2"/><path d="M5 6l14 12M19 6L5 18" opacity="0"/><path d="M8 4h8 M4 8v8" opacity="0.6"/></svg><span>边框 / 阴影</span>
        </button>
        <span class="toolbar-menu-heading">识别与保存</span>
        <button class="action-btn toolbar-menu-item" data-action="ask" type="button" title="问 AI">
          <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 0-8 8c0 1.6.5 3 1.3 4.2L4 20l4-1.2A8 8 0 1 0 12 4z"/><path d="M9.5 10a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.7-.9 1.4"/><circle cx="12" cy="16.5" r=".6"/></svg>
          <span>问 AI</span>
        </button>
        <button class="action-btn toolbar-menu-item" data-action="table" type="button" title="AI 表格识别（输出 Markdown / CSV）">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18 M9 4v16 M15 4v16 M3 14h18"/></svg>
          <span>AI 表格</span>
        </button>
        <button class="action-btn toolbar-menu-item" data-action="formula" type="button" title="AI 公式识别（输出 LaTeX）">
          <svg viewBox="0 0 24 24"><path d="M5 5h13 M5 19h13 M8 5l-3 7 3 7 M12 9l6 6 M18 9l-6 6"/></svg>
          <span>AI 公式</span>
        </button>
        <button class="action-btn toolbar-menu-item" id="btnQR" data-action="qr" type="button" title="查看二维码 / 条码识别状态与结果">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3z M20 14h1 M14 20h1 M18 18h3v3h-3"/></svg>
          <span>条码结果</span>
        </button>
        <button class="action-btn toolbar-menu-item" data-action="polish" type="button" title="润色图中文字（提取并润色，结果在面板显示）">
          <svg viewBox="0 0 24 24"><path d="M4 20l4-1 9-9-3-3-9 9-1 4z M14 6l3 3 M4 4h3 M5.5 2.5v3"/></svg>
          <span>文字润色</span>
        </button>
        <button class="action-btn toolbar-menu-item" data-action="save" type="button" title="保存到文件">
          <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z M8 4v5h7V4 M8 14h8v6H8z"/></svg>
          <span>保存到文件</span>
        </button>
        <button class="action-btn toolbar-menu-item" data-action="quickSave" type="button" title="快速保存（免对话框，直接存到保存目录）">
          <svg viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11L9.5 22 19 10h-6.5z"/></svg>
          <span>快速保存</span>
        </button>
      </div>
      <button class="action-btn" data-action="pin" title="贴图钉屏" aria-label="贴图钉屏">
        <svg viewBox="0 0 24 24"><path d="M14 3l7 7-3 1-3 3-1 5-4-4-5 5 5-5-4-4 5-1 3-3z"/></svg>
        <span>贴图</span>
      </button>
      <button class="action-btn primary" data-action="copy" title="复制到剪贴板 (Enter)" aria-label="复制到剪贴板">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="1"/><path d="M5 16V4h11"/></svg>
        <span>复制</span>
      </button>
      <button class="action-btn danger icon-only" data-action="cancel" title="取消 (Esc)" aria-label="取消截图">
        <svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
      </button>
    </div>
  </div>

  <!-- 文字输入框（编辑文字标注时浮现） -->
  <textarea id="textInput" class="text-input" hidden spellcheck="false"></textarea>

  <!-- OCR 就地面板（截图内直接识别文字） -->
  <div id="ocrPanel" class="ocr-panel" hidden>
    <div class="ocr-head">
      <span class="ocr-title">OCR 识别结果</span>
      <button class="ocr-btn" id="btnOcrCopy" type="button">复制</button>
      <button class="ocr-btn" id="btnOcrTranslate" type="button">翻译</button>
      <button class="ocr-btn" id="btnOcrPolish" type="button">润色</button>
      <button class="ocr-btn ocr-btn-close" id="btnOcrClose" type="button">✕</button>
    </div>
    <textarea id="ocrTextArea" class="ocr-text" placeholder="识别中…" spellcheck="false"></textarea>
  </div>

  <!-- UI 元素识别高亮框 -->
  <div id="axHighlight" class="ax-highlight" hidden></div>

  <!-- 二维码 / 条码结果面板 -->
  <div id="qrPanel" class="qr-panel" hidden>
    <div class="qr-title">条码识别结果</div>
    <div id="qrStatus" class="qr-status" role="status" aria-live="polite">等待扫描</div>
    <div id="qrText" class="qr-text"></div>
    <div class="qr-actions">
      <button class="qr-btn" id="btnQrCopy" type="button">复制</button>
      <button class="qr-btn" id="btnQrOpen" type="button">打开链接</button>
      <button class="qr-btn" id="btnQrRetry" type="button">重新扫描</button>
      <button class="qr-btn qr-btn-close" id="btnQrClose" type="button">关闭</button>
    </div>
  </div>

  <script src="./vendor/jsQR.js"></script>
  <script src="./overlay-geometry.js"></script>
  <script src="./overlay.js"></script>
</body>
</html>
