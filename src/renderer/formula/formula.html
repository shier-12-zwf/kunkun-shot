<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LaTeX 公式贴图</title>
  <link rel="stylesheet" href="../../../node_modules/katex/dist/katex.min.css" />
  <link rel="stylesheet" href="./formula.css" />
</head>
<body>
  <main class="formula-shell">
    <header>
      <div>
        <p class="eyebrow">OFFLINE FORMULA PIN</p>
        <h1>LaTeX 公式贴图</h1>
      </div>
      <button class="quiet" id="btnClose" type="button" aria-label="关闭">关闭</button>
    </header>

    <label class="field-label" for="formulaInput">LaTeX 公式</label>
    <textarea id="formulaInput" spellcheck="false" maxlength="4000" autofocus>\frac{-b \pm \sqrt{b^2-4ac}}{2a}</textarea>

    <section class="options" aria-label="公式样式">
      <label>字号 <input id="fontSize" type="range" min="14" max="72" value="32" /><output id="fontSizeValue">32</output></label>
      <label>文字 <input id="textColor" type="color" value="#111827" /></label>
      <label>背景
        <select id="background">
          <option value="transparent">透明</option>
          <option value="#ffffff">白色</option>
          <option value="#fff7ed">暖白</option>
          <option value="#111827">深色</option>
        </select>
      </label>
    </section>

    <section class="preview-card" aria-label="公式预览">
      <div id="formulaPreview" class="formula-preview"></div>
      <p id="formulaError" class="formula-error" role="alert" hidden></p>
    </section>

    <footer>
      <p>本地 KaTeX 渲染，不上传公式内容。</p>
      <button class="primary" id="btnCreate" type="button">生成并贴到屏幕</button>
    </footer>
  </main>

  <script src="../../../node_modules/katex/dist/katex.min.js"></script>
  <script src="./formula-model.js"></script>
  <script src="./formula.js"></script>
</body>
</html>
