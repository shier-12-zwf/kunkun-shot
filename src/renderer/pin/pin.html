<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'none'" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贴图 · 困困截图工具</title>
  <link rel="stylesheet" href="./pin.css" />
</head>
<body>
  <!-- 整张图片可拖动移动窗口（drag 区在 CSS 中设置） -->
  <div class="pin-wrap" id="pinWrap">
    <img class="pin-img" id="pinImg" alt="贴图" draggable="false" />

    <!-- 选字层：OCR 行级坐标映射出的可点击文字块（T 键切换，平时隐藏） -->
    <div class="pin-ocr-layer" id="pinOcrLayer" hidden></div>

    <!-- 右上角迷你工具栏：悬停时显示，no-drag 保证按钮可点 -->
    <div class="pin-toolbar" id="pinToolbar" role="toolbar" aria-label="贴图工具栏">
      <button class="tool-btn" id="btnCopy" title="复制图片" aria-label="复制图片">
        <!-- 复制：两个叠加的方框 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="11" height="11" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
      <button class="tool-btn" id="btnSave" title="保存到本地" aria-label="保存">
        <!-- 保存：下载箭头入托盘 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>
      <button class="tool-btn" id="btnOcr" title="OCR 识别文字" aria-label="OCR">
        <!-- OCR：文字 T -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
      </button>
      <button class="tool-btn" id="btnAsk" title="问 AI" aria-label="问 AI">
        <!-- 问 AI：对话气泡 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </button>
      <button class="tool-btn" id="btnText" title="选择文字（T）：识别后点击文字即可复制" aria-label="选择文字">
        <!-- 选字：文本光标 I -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18"></path>
          <path d="M7 3h10 M7 21h10"></path>
        </svg>
      </button>
      <span class="tool-sep" aria-hidden="true"></span>
      <button class="tool-btn tool-danger" id="btnClose" title="关闭贴图（Esc）" aria-label="关闭">
        <!-- 关闭：叉 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- 自绘右键菜单 -->
  <div class="ctx-menu" id="ctxMenu" role="menu" aria-hidden="true">
    <div class="ctx-item" data-act="copy" role="menuitem">复制图片</div>
    <div class="ctx-item" data-act="save" role="menuitem">保存到本地</div>
    <div class="ctx-sep" aria-hidden="true"></div>
    <div class="ctx-item" data-act="ocr" role="menuitem">OCR 识别文字</div>
    <div class="ctx-item" data-act="textSel" role="menuitem">选择文字　T</div>
    <div class="ctx-item" data-act="ask" role="menuitem">问 AI</div>
    <div class="ctx-sep" aria-hidden="true"></div>
    <div class="ctx-item" data-act="zoomIn" role="menuitem">放大　＋</div>
    <div class="ctx-item" data-act="zoomOut" role="menuitem">缩小　－</div>
    <div class="ctx-item" data-act="zoomReset" role="menuitem">原始大小　0</div>
    <div class="ctx-sep" aria-hidden="true"></div>
    <div class="ctx-item ctx-danger" data-act="close" role="menuitem">关闭贴图</div>
  </div>

  <!-- 轻量提示气泡（复制/保存反馈） -->
  <div class="pin-toast" id="pinToast" aria-live="polite"></div>

  <script src="./pin.js"></script>
</body>
</html>
