<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贴图 · 困困截图工具</title>
  <link rel="stylesheet" href="./pin.css" />
</head>
<body>
  <!-- 整张图片可拖动移动窗口（drag 区在 CSS 中设置） -->
  <div class="pin-wrap" id="pinWrap">
    <img class="pin-img" id="pinImg" alt="贴图" draggable="false" />

    <!-- 文本贴图内容（剪贴板文字贴图时显示） -->
    <div class="pin-text" id="pinText" hidden></div>
    <!-- 颜色贴图内容（剪贴板颜色值贴图时显示） -->
    <div class="pin-color" id="pinColor" hidden></div>
    <!-- 文件贴图内容（Finder 复制文件后贴图） -->
    <div class="pin-file" id="pinFile" hidden>
      <span class="pin-file-icon">📄</span>
      <span class="pin-file-name" id="pinFileName"></span>
      <span class="pin-file-hint">点击打开 · Cmd+C 复制路径</span>
    </div>

    <!-- 独立标注层：只擦除标注，不会破坏底图 -->
    <canvas class="pin-annotation-canvas" id="pinAnnotationCanvas" hidden></canvas>

    <!-- 贴图标题栏（F2 设置后显示在底部） -->
    <div class="pin-title" id="pinTitle" hidden></div>
    <input class="pin-title-input" id="pinTitleInput" type="text" placeholder="输入贴图标题，Enter 确认" hidden />

    <!-- 选字层：OCR 行级坐标映射出的可点击文字块（S 键切换，平时隐藏） -->
    <div class="pin-ocr-layer" id="pinOcrLayer" hidden></div>

    <!-- 右上角迷你工具栏：悬停时显示，no-drag 保证按钮可点 -->
    <div class="pin-toolbar" id="pinToolbar" role="toolbar" aria-label="贴图工具栏">
      <button class="tool-btn" id="btnCopy" title="复制图片" aria-label="复制图片">
        <!-- 复制：两个叠加的方框 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="11" height="11" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
      <button class="tool-btn" id="btnSave" title="保存到本地" aria-label="保存">
        <!-- 保存：下载箭头入托盘 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>
      <button class="tool-btn" id="btnOcr" title="OCR 识别文字" aria-label="OCR">
        <!-- OCR：文字 T -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
      </button>
      <button class="tool-btn" id="btnAsk" title="问 AI" aria-label="问 AI">
        <!-- 问 AI：对话气泡 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </button>
      <button class="tool-btn" id="btnText" title="选择文字（S）：识别后点击文字即可复制" aria-label="选择文字">
        <!-- 选字：文本光标 I -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18"></path>
          <path d="M7 3h10 M7 21h10"></path>
        </svg>
      </button>
      <button class="tool-btn" id="btnAnnotate" title="标注贴图" aria-label="标注贴图">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"></path>
        </svg>
      </button>
      <span class="tool-sep" aria-hidden="true"></span>
      <button class="tool-btn tool-danger" id="btnClose" title="关闭贴图（Esc）" aria-label="关闭">
        <!-- 关闭：叉 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="pin-annotation-toolbar" id="pinAnnotationToolbar" role="toolbar" aria-label="贴图标注工具" hidden>
      <button class="annotation-btn active" data-pin-tool="pen" title="自由画笔">&#9998;</button>
      <button class="annotation-btn" data-pin-tool="line" title="直线">&#9585;</button>
      <button class="annotation-btn" data-pin-tool="arrow" title="箭头">&#8599;</button>
      <button class="annotation-btn" data-pin-tool="rect" title="矩形">&#9633;</button>
      <button class="annotation-btn" data-pin-tool="ellipse" title="椭圆">&#9711;</button>
      <button class="annotation-btn" data-pin-tool="text" title="文本">T</button>
      <button class="annotation-btn" data-pin-tool="eraser" title="橡皮">&#8998;</button>
      <input class="annotation-color" id="pinAnnotationColor" type="color" value="#ff3b30" title="标注颜色" aria-label="标注颜色" />
      <span class="tool-sep" aria-hidden="true"></span>
      <button class="annotation-btn" data-pin-edit="undo" title="撤销（Cmd+Z）">&#8630;</button>
      <button class="annotation-btn" data-pin-edit="redo" title="重做（Cmd+Shift+Z）">&#8631;</button>
      <button class="annotation-btn" data-pin-edit="clear" title="清空标注">&#128465;</button>
    </div>
  </div>

  <!-- 自绘右键菜单 -->
  <div class="ctx-menu" id="ctxMenu" role="menu" aria-label="贴图操作" aria-hidden="true">
    <div class="ctx-item" data-act="copy" role="menuitem" tabindex="-1">复制图片</div>
    <div class="ctx-item" data-act="save" role="menuitem" tabindex="-1">保存到本地</div>
    <div class="ctx-sep" aria-hidden="true"></div>
    <div class="ctx-item" data-act="ocr" role="menuitem" tabindex="-1">OCR 识别文字</div>
    <div class="ctx-item" data-act="lock" role="menuitem" tabindex="-1">锁定 / 解锁　L</div>
    <div class="ctx-item" data-act="topToggle" role="menuitem" tabindex="-1">置顶 / 取消置顶　T</div>
    <div class="ctx-item" data-act="textSel" role="menuitem" tabindex="-1">选择文字　S</div>
    <div class="ctx-item" data-act="annotate" role="menuitem" tabindex="-1">标注贴图</div>
    <div class="ctx-item" data-act="passthrough" role="menuitem" tabindex="-1">鼠标穿透　P</div>
    <div class="ctx-item" data-act="title" role="menuitem" tabindex="-1">设置标题　F2</div>
    <div class="ctx-item" data-act="ask" role="menuitem" tabindex="-1">问 AI</div>
    <div class="ctx-sep" aria-hidden="true"></div>
    <div class="ctx-item" data-act="zoomIn" role="menuitem" tabindex="-1">放大　＋</div>
    <div class="ctx-item" data-act="zoomOut" role="menuitem" tabindex="-1">缩小　－</div>
    <div class="ctx-item" data-act="zoomReset" role="menuitem" tabindex="-1">原始大小　0</div>
    <div class="ctx-sep" aria-hidden="true"></div>
    <div class="ctx-item ctx-danger" data-act="close" role="menuitem" tabindex="-1">关闭贴图</div>
  </div>

  <!-- 轻量提示气泡（复制/保存反馈） -->
  <div class="pin-toast" id="pinToast" aria-live="polite"></div>

  <script src="../../shared/pin-content-update.js"></script>
  <script src="./pin-annotations.js"></script>
  <script src="./pin.js"></script>
</body>
</html>
